name: CI

on:
  push:
    # `ui-rewrite` is the long-lived branch for tether#173's phase-1 front-end
    # rewrite. It is here because tether#174's first acceptance criterion is
    # "GOWORK=off go build ./... passes on EVERY commit of the UI branch", and the
    # only mechanism that can hold that is CI on every push to it. The `pull_request`
    # trigger below already covers PRs *into* it, but the branch also takes direct
    # commits (rebases onto main, in particular), and those are exactly the commits
    # where web/dist stops matching web/src.
    #
    # It is deletable, not permanent: remove this entry when phase 1 merges to main.
    branches: [main, "pf2.*", ui-rewrite]
  # No `branches:` filter on purpose. It used to be `[main]`, which reads like
  # "PRs into main" and behaves like "PRs into anything else run zero checks":
  # a stacked PR — B onto A, A onto main — got no CI at all, so B's checks were
  # first attempted only after A merged and B was retargeted. A gate that skips
  # the review it is supposed to gate is not a narrower gate, it is absent.
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The vendor-provenance diff gate below reads the manifest as of the
          # PR base, so the base commit has to be in the local object store. The
          # default depth-1 fetch gives only the merge ref.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Install tygo
        run: go install github.com/gzuidhof/tygo@v0.2.21

      # ── generated-artifact gate (tether#81) ─────────────────────────────────
      # web/dist is the SPA that gets compiled into the binary. It used to be
      # committed, so nothing kept it equal to web/src — one commit changed src
      # without rebuilding dist, and from then on any build that skipped
      # `pnpm build` would have embedded the previous SPA with all tests green.
      # Runs before the web build because it reads the git index, not the tree.
      - name: Check no generated artifacts committed
        run: bash scripts/check-artifacts-uncommitted.sh

      # ── vendored-upstream provenance gate (tether#171) ──────────────────────
      # web/src/vendor/cloudcli/ is CloudCLI UI's source, copied byte-for-byte at
      # a pinned tag. Keeping it byte-identical is what makes
      # `git diff <old-sha>..<new-sha>` still applicable when we absorb a later
      # tag; one in-place edit ends that permanently, and nothing about an edited
      # file looks wrong from the outside.
      #
      # Derives the file set from `find` over the vendor root unioned with the
      # git index — not from the manifest — and requires the two to agree in both
      # directions, so an undeclared vendored file is red rather than invisible.
      # That direction is the whole point: the manifest-iterating version of this
      # check passes forever while blind, which is the defect WIRE-8 already has
      # in web/test/wire-contract.spec.ts. `find` and not `git ls-files --others
      # --exclude-standard`, because the latter honours .gitignore and tether's
      # .gitignore has un-anchored entries — a gitignored `.env` dropped into the
      # vendor root was measured passing the first version of this check.
      #
      # Offline and dependency-free (bash + jq + git), hence its position up here
      # beside the artifact gate rather than after the builds. The network half —
      # "are the recorded hashes what upstream really published" — is
      # `verify-upstream`, which an absorption runs by hand; see step 5 of
      # docs/vendoring-cloudcli.md for why it is not a per-PR gate.
      - name: Check vendored upstream provenance
        run: bash scripts/check-vendor-provenance.sh check

      # The half `check` structurally cannot do. `check` compares the tree
      # against the manifest, and both sides are writable in the same commit, so
      # an in-place edit plus `rehash` leaves consistent state and passes. Reading
      # the *change* closes it: upstream's bytes at a fixed sha never change, so a
      # content hash that moves while the entry's tag/sha/status stay put is an
      # in-place edit by definition. Offline and deterministic, so unlike
      # verify-upstream it belongs on every PR.
      #
      # This replaces a sentence in docs/vendoring-cloudcli.md asking reviewers to
      # paste verify-upstream output into any PR that touches a hash — a request
      # addressed to people, enforced by nobody, on the one path where the whole
      # arrangement fails silently.
      #
      # PR-only because it needs two endpoints. On a push there is no reliable
      # base: `github.event.before` is all-zeros for a new branch and points at a
      # discarded commit after a force-push. PRs are where the diff is reviewed
      # anyway, and `pull_request` now fires for every base branch (see `on:`).
      - name: Check vendored provenance diff against PR base
        if: github.event_name == 'pull_request'
        run: bash scripts/check-vendor-provenance.sh check-diff "@${{ github.event.pull_request.base.sha }}"

      # ── codegen drift gate (D-22 §2.6, K.7.1) ──────────────────────────────
      # This used to be two steps:
      #
      #     - name: Run codegen
      #       run: bash scripts/codegen.sh
      #     - name: Check codegen drift
      #       run: git diff --exit-code web/src/lib/wire.gen.ts
      #
      # They are one step now because the split was itself a hole. The diff only
      # means anything after codegen has run, and nothing in the YAML said so:
      # measured in tether#174, running the check alone against a tree with an
      # extra field on wire.Envelope printed "OK: web/src/lib/wire.gen.ts matches
      # internal/wire/" and exited 0. It was reading a generated file that had
      # simply not been regenerated yet. So deleting, disabling or reordering the
      # generate step would have left a green gate asserting something false --
      # the same "green because the check is absent" class as the two defects
      # below, and invisible in review because both steps look fine on their own.
      # Generating and comparing in one step makes the dependency unbreakable.
      #
      # 🔴 Two further independent ways the old gate reported PASS while checking
      # nothing. Both were measured, neither is reasoned, and the first one was
      # about to fire: tether#174 deletes web/src, and tether#168 is adding a
      # field to wire.Envelope at the same time.
      #
      # (1) THE PATH IS NOT TRACKED. `git diff --exit-code <untracked-but-present
      #     path>` exits **0**. tygo's writer calls os.MkdirAll before
      #     os.WriteFile (tygo generator.go:72 and :77 at v0.2.21 — the exact tag
      #     the "Install tygo" step above pins), so the "Run codegen" step
      #     RECREATES a deleted wire.gen.ts on disk as an untracked file, and the
      #     diff above then finds nothing to compare. Verified in a scratch repo on
      #     both branches: tracked -> deleted -> recreated-on-disk = exit 0; absent
      #     from index AND worktree = exit 128. Only the second branch is safe, and
      #     a generator that MkdirAll's never produces it. So the gate's failure
      #     mode was indistinguishable from its success, forever, from the first
      #     commit of any wi that untracks the file. Nothing else caught it:
      #     check-artifacts-uncommitted.sh runs BEFORE codegen and its
      #     INDEX_FORBIDDEN list never mentions wire.gen.ts.
      #
      # (2) THE GATE HELD ITS OWN COPY OF THE PATH. `web/src/lib/wire.gen.ts` was
      #     written here and in tygo.yaml, and tygo.yaml is what DECIDES where
      #     codegen writes. Move `output_path` and this step keeps diffing a file
      #     nothing regenerates any more: still tracked, still unchanged, still
      #     exit 0. Same failure class one level up, so fixing only (1) would have
      #     left a gate that is green because the check is absent.
      #
      # Hence: read the path from tygo.yaml, assert the precondition `git diff`
      # cannot express, and only then diff. The assertion is what makes this a
      # gate rather than a path change — tether#174's own acceptance criterion is
      # that a mutant (edit internal/wire/ without regenerating) turns this red,
      # and that both untracking the file and moving output_path turn it red too.
      - name: Run codegen and check for drift
        run: |
          set -euo pipefail

          # Generate first, in the same step, so the comparison below cannot be
          # left comparing a file against itself. See the comment above.
          bash scripts/codegen.sh

          mapfile -t outs < <(sed -n 's/^[[:space:]]*output_path:[[:space:]]*//p' tygo.yaml)
          if (( ${#outs[@]} != 1 )); then
            echo "FAIL: expected exactly one 'output_path:' in tygo.yaml, found ${#outs[@]}." >&2
            echo "      This gate reads the path from tygo.yaml on purpose (see the" >&2
            echo "      comment above). If codegen now writes several files, this step" >&2
            echo "      has to check all of them — it must not silently check one." >&2
            exit 1
          fi
          gen="${outs[0]}"
          echo "codegen target, per tygo.yaml: $gen"

          if ! git ls-files --error-unmatch -- "$gen" >/dev/null 2>&1; then
            echo "FAIL: '$gen' is not tracked in git." >&2
            echo "      tygo recreates it on every run (MkdirAll + WriteFile), so" >&2
            echo "      'git diff --exit-code' would exit 0 while comparing nothing." >&2
            echo "      Commit the generated file, or move this gate to wherever the" >&2
            echo "      wire contract now lives." >&2
            exit 1
          fi

          if ! git diff --exit-code -- "$gen"; then
            echo >&2
            echo "FAIL: '$gen' is stale with respect to internal/wire/." >&2
            echo "      Run 'make codegen' and commit the result." >&2
            exit 1
          fi
          echo "OK: $gen is tracked and matches internal/wire/"

      # ── web build ───────────────────────────────────────────────────────────
      - name: Install web dependencies
        run: cd web && pnpm install --frozen-lockfile

      # ── typecheck gates (tether#165, tether#174) ────────────────────────────
      # web/package.json's `typecheck` script had NO automated consumer before this
      # step: measured on baf7117, `typecheck` appears 0 times under .github/, 0
      # times in the Makefile, 0 times under scripts/, and there is no .husky/. So
      # tether#165 repaired a gate that nothing ran — anyone reverting its fix would
      # have turned nothing red.
      #
      # 🔴 Be precise about what this step buys, because overclaiming it is the same
      # mistake one layer along: it makes the script's EXISTENCE load-bearing (delete
      # the script and pnpm exits non-zero), and nothing more. Replace its body with
      # `"typecheck": "true"` and this step is still green. The step below is the one
      # that can go red on a weakened typecheck, and it is not redundant with this
      # one.
      #
      # Also not redundant with "Build web": `pnpm build` is `tsc -b && vite build`,
      # so type errors are already gated. Running the named script is what keeps the
      # script itself honest.
      #
      # 🔴 This step and "Build web" below are a `tsc -b --noEmit` immediately
      # followed by a `tsc -b` that must emit, sharing one tsbuildinfo. On a
      # COMPOSITE project that pair poisons itself and the emitting run silently
      # skips emit at exit 0 — measured, tether#165/#174. What makes the order safe
      # is that neither referenced project sets `composite`, and the prohibition is
      # recorded in web/tsconfig.app.json's header, i.e. in the file someone would
      # have to edit to break it. Do not "fix" the redundancy by reordering these
      # two: the order is not what protects it.
      - name: Typecheck web
        run: cd web && pnpm typecheck

      # Asserts the typecheck's COVERAGE, measured, rather than its `include` globs.
      #
      # Measured on baf7117 with `tsc -p <project> --listFiles`:
      #
      #     tsconfig.app.json   include ["src"]            -> 82 files
      #     tsconfig.node.json  include ["vite.config.ts"] ->  1 file
      #     web/test/*.spec.ts  in NEITHER project         ->  0 files  (5 existed)
      #
      # So tether#165's acceptance — "typecheck must be shown red" — was fully
      # satisfiable with a mutant inside src/, and was: the gate shipped real, five
      # spec files stayed outside it, and the whole thing carried the label of a
      # fixed gate. tether#173 §4 then ports 11 A-grade test files in, three of them
      # into web/test/. Reading the glob is exactly how the 0 stayed invisible, so
      # this checks the file set tsc reports.
      #
      # The invariant is a SUBSET, not a count: every test file in the repo is inside
      # the set `pnpm typecheck` reads. A count would go red every time someone adds
      # a file, which makes it a gate people edit rather than obey; the subset check
      # only fires when a test file is genuinely uncovered.
      #
      # `tsc -b --listFiles` and not per-project `tsc -p`: `-b` is what `pnpm
      # typecheck` actually runs, so this measures the real invocation and not a
      # re-derivation of it that could drift. (Build mode does accept --listFiles;
      # verified, exit 0, output spanning both referenced projects.)
      #
      # The left side is the UNION of two sources, because they answer "must be
      # type-checked" in two different ways and each misses something the other
      # catches:
      #   `vitest list --filesOnly`  the files vitest will actually execute,
      #                              enumerated by the runner itself rather than by
      #                              this file's copy of its glob. A copy would go
      #                              stale against vitest's own `include` — and a
      #                              gate deriving its expectation from a copy of
      #                              the thing it checks is WIRE-8's exact defect.
      #   `git ls-files` on the      files that are test files by name but that
      #   test/spec name patterns    vitest is NOT running. Those still have to
      #                              type-check: a spec sitting in the repo
      #                              unexecuted is a separate problem, but it is
      #                              not an excuse to stop type-checking it.
      #
      # 🔴 The two emptiness guards are not defensive padding. A subset assertion
      # over an empty left side passes vacuously, so "there are no test files" and
      # "every test file is covered" would be the same green — the precise defect
      # this gate exists to prevent, rebuilt inside the gate. It has already fired
      # once for real, during tether#174, on a tree whose new specs were not yet
      # staged.
      - name: Check typecheck covers every test file
        run: |
          set -euo pipefail
          cd web

          # LC_ALL=C throughout: `comm` compares byte-wise, so it silently
          # mis-reports set membership if `sort` used a locale collation instead.
          # Both sides have to agree, and only the byte order is guaranteed to.
          export LC_ALL=C

          # What tsc really reads, as web-relative paths.
          pnpm exec tsc -b --listFiles \
            | sed "s#^${PWD}/##" \
            | sort -u > /tmp/tc-covered.txt

          # What has to be covered (see the comment above for why this is a union).
          pnpm exec vitest list --filesOnly > /tmp/tc-vitest.txt
          git ls-files -- '*.test.ts' '*.test.tsx' '*.spec.ts' '*.spec.tsx' \
            > /tmp/tc-indexed.txt
          sort -u /tmp/tc-vitest.txt /tmp/tc-indexed.txt > /tmp/tc-tests.txt

          n_cov=$(grep -cv '^node_modules/' /tmp/tc-covered.txt || true)
          n_tests=$(wc -l < /tmp/tc-tests.txt)
          echo "typecheck reads ${n_cov} project file(s) under web/"
          echo "test files to cover: ${n_tests} (union of $(wc -l < /tmp/tc-vitest.txt) from vitest and $(wc -l < /tmp/tc-indexed.txt) from the git index)"

          if [[ "$n_tests" -eq 0 ]]; then
            echo "FAIL: no test files found under web/." >&2
            echo "      The subset check below would pass vacuously, which is the" >&2
            echo "      blind-gate failure this step exists to prevent. If the suite" >&2
            echo "      really is meant to be empty, delete this step deliberately." >&2
            exit 1
          fi
          if [[ "$n_cov" -eq 0 ]]; then
            echo "FAIL: 'tsc -b --listFiles' reported no project files at all." >&2
            echo "      Typecheck is reading nothing — the tether#165 defect, back." >&2
            exit 1
          fi

          uncovered=$(comm -23 /tmp/tc-tests.txt /tmp/tc-covered.txt)
          if [[ -n "$uncovered" ]]; then
            echo "FAIL: these test files are OUTSIDE the typecheck's coverage:" >&2
            sed 's/^/  /' <<<"$uncovered" >&2
            echo >&2
            echo "      A test file no tsconfig 'include' reaches is never" >&2
            echo "      type-checked, so type errors in it are invisible while" >&2
            echo "      'pnpm typecheck' stays green. Add its directory to" >&2
            echo "      web/tsconfig.app.json's include (that file's comment has the" >&2
            echo "      measured history)." >&2
            exit 1
          fi
          echo "OK: all ${n_tests} test file(s) are inside the typecheck coverage set"

      - name: Build web
        run: cd web && pnpm build

      # Writes web/dist/BUILD-ID from the content of the bundle so the go build
      # below compiles it in. Has to run between the two.
      - name: Stamp SPA bundle
        run: bash scripts/spa-bundle.sh stamp

      # ── Go build ────────────────────────────────────────────────────────────
      # Depends on "Build web" above: web/dist is not in git, so this step is
      # also the check that the embed target exists at all.
      - name: Build Go binary
        run: go build -o bin/tether ./cmd/tether

      # Pins the embed hop itself: the binary must carry the bundle "Build web"
      # just produced, not one left over from somewhere else. A finished binary
      # is otherwise indistinguishable from one built against a stale dist.
      - name: Check binary embeds the SPA just built
        run: bash scripts/spa-bundle.sh check bin/tether

      # ── cross-compile gate (tether#85) ──────────────────────────────────────
      # Every step above this one builds for the runner's own GOOS; releases go
      # out for five. So internal/mcp/builtin could use syscall.Setpgid and
      # syscall.Kill with no build tags from 4ded192 (2026-05-12) onward without
      # a single CI run noticing — the failure was reachable only by pushing a
      # tag, in the release workflow's windows matrix leg, which took the whole
      # release down with it: that matrix had no `fail-fast: false`, so its
      # siblings were cancelled mid-build (four in run 28437119947, three in
      # 28776556885 — linux/amd64 had already finished there), and the publish
      # job needs them all. v0.4.1 and v0.5.0 were tagged and got no GitHub
      # Release at all.
      #
      # `go vet` as well as `go build`, because `go build ./...` does not
      # compile _test.go files and a windows-hostile test would sail through it.
      #
      # Has to stay below "Build web": web/dist is not in git (tether#81), so
      # higher up this step would fail on `web/embed.go: pattern all:dist` for
      # every platform, including the ones that are fine. It does not care where
      # "Stamp SPA bundle" sits.
      - name: Cross-compile every released platform
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          source scripts/platforms.sh
          for p in "${PLATFORMS[@]}"; do
            echo "==> $p"
            GOOS="${p%/*}" GOARCH="${p#*/}" go build -o /dev/null ./...
            GOOS="${p%/*}" GOARCH="${p#*/}" go vet ./...
          done

      # ── wire-contract tests (D-22 §6) ───────────────────────────────────────
      - name: Run wire-contract tests
        id: web_tests
        run: cd web && pnpm test

      # Keeps the machine-readable report web/vite.config.ts writes on every run
      # (tether#105 — this suite has a ~5% flake that has now been seen twice and
      # named zero times). Without this step a red run leaves the name of the
      # failing test only in raw log output that nobody opens, so the response to
      # a red is "rerun it", and a gate people rerun past is not a gate.
      #
      # `if: always()` is the entire point and not boilerplate: a step with no
      # condition is skipped once the job is already failing, i.e. skipped on
      # precisely the runs worth keeping evidence from.
      #
      # `outcome != 'skipped'` narrows always() back to "the test step actually
      # ran", so a failure further up (codegen drift, build web) does not send an
      # empty directory into if-no-files-found. That option is `error` on
      # purpose: if the reporters ever stop writing, `pnpm test` still exits 0 and
      # this step is the only thing that would notice.
      #
      # Both branches were measured on this workflow rather than argued from the
      # YAML, which cannot show either one. Failing test (run 32148999848): the
      # test step failed, this step still ran, and the artifact carries the name
      # of the test. Failing codegen-drift step (run 32149533126): the test step
      # was skipped, so `outcome` really is 'skipped' for a step that never ran
      # and this one skipped too instead of erroring on an empty directory.
      - name: Upload web test report
        if: always() && steps.web_tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: web-test-report
          path: web/test-results/
          if-no-files-found: error

      # ── Go tests ────────────────────────────────────────────────────────────
      # -race is the baseline, not an extra: internal/server runs a background
      # cert-rotation goroutine that shares state with request handlers and the
      # TLS handshake callback, and internal/session hands entries between
      # connections. -count=1 because the test cache will happily echo a stale
      # pass. Spelled out here rather than delegated to `make go-test` so a
      # local convenience edit to the Makefile can never weaken CI.
      - name: Run Go tests
        run: go test -count=1 -race ./...

      # ── opt-in test compiles, but does not run (tether#160) ────────────────
      # internal/agent/opencode_provider_realbin_test.go is behind
      # //go:build opencode_real because it needs a real `opencode` binary,
      # which this runner does not have. The step above therefore does not
      # compile it, and a build tag with nothing compiling it is a test that
      # stops building and tells no one — the same class of silent hole the tag
      # was introduced to close, just moved.
      #
      # `go vet` and not `go build`: `go build ./...` skips _test.go files
      # entirely, so it would pass no matter what is in there. Compile only, on
      # purpose — running it would mean installing opencode and spawning a real
      # subprocess per PR, which is a cost this test does not earn.
      - name: Type-check opt-in real-binary tests
        run: go vet -tags=opencode_real ./internal/agent/
