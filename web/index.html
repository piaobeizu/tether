<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobile-first is tether#173 decision 5, so the viewport tag is scaffold,
         not decoration: the new shell is written against this width. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0f0f" />
    <!-- web/public/ is still tracked and still copied into dist/ by vite, so the
         manifest link keeps resolving. The service-worker registration that used
         to live in web/src/pwa/ went with the old SPA; re-adding it belongs to
         whichever wi rebuilds the shell, not to this one. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The stylesheet's entry point (tether#194), and it is here rather than in
         src/main.tsx deliberately. tether#186 holds main.tsx while it adds an
         /auth branch, and tether#194's job is to make the CSS pipeline work in a
         way that is provable on web/dist without touching that file — a
         stylesheet no entry point reaches emits no CSS asset at all, so vite
         would produce a green build with nothing to inspect.
         It is also the more durable of the two homes: as an HTML <link> the
         built CSS asset does not depend on which JS module imported it first.
         Whichever wi builds the shell may move it into main.tsx; nothing here
         depends on it staying. -->
    <link rel="stylesheet" href="/src/ui/index.css" />
    <title>tether</title>
  </head>
  <body>
    <!-- Phase-1 scaffold (tether#174). The Geist / Geist Mono / Instrument Serif
         <link>s that used to sit here referenced font families declared in
         web/src/index.css, which this wi deleted. A remote font dependency with
         no consumer is worse than no font dependency, so they are gone; the shell
         wi re-adds whatever the new tokens actually reference. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
