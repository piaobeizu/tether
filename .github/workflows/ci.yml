name: CI

on:
  push:
    branches: [main, "pf2.*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Install tygo
        run: go install github.com/gzuidhof/tygo@v0.2.21

      # ── generated-artifact gate (tether#81) ─────────────────────────────────
      # web/dist is the SPA that gets compiled into the binary. It used to be
      # committed, so nothing kept it equal to web/src — one commit changed src
      # without rebuilding dist, and from then on any build that skipped
      # `pnpm build` would have embedded the previous SPA with all tests green.
      # Runs before the web build because it reads the git index, not the tree.
      - name: Check no generated artifacts committed
        run: bash scripts/check-artifacts-uncommitted.sh

      # ── codegen drift gate (D-22 §2.6, K.7.1) ──────────────────────────────
      - name: Run codegen
        run: bash scripts/codegen.sh

      - name: Check codegen drift
        run: git diff --exit-code web/src/lib/wire.gen.ts

      # ── web build ───────────────────────────────────────────────────────────
      - name: Install web dependencies
        run: cd web && pnpm install --frozen-lockfile

      - name: Build web
        run: cd web && pnpm build

      # Writes web/dist/BUILD-ID from the content of the bundle so the go build
      # below compiles it in. Has to run between the two.
      - name: Stamp SPA bundle
        run: bash scripts/spa-bundle.sh stamp

      # ── Go build ────────────────────────────────────────────────────────────
      # Depends on "Build web" above: web/dist is not in git, so this step is
      # also the check that the embed target exists at all.
      - name: Build Go binary
        run: go build -o bin/tether ./cmd/tether

      # Pins the embed hop itself: the binary must carry the bundle "Build web"
      # just produced, not one left over from somewhere else. A finished binary
      # is otherwise indistinguishable from one built against a stale dist.
      - name: Check binary embeds the SPA just built
        run: bash scripts/spa-bundle.sh check bin/tether

      # ── cross-compile gate (tether#85) ──────────────────────────────────────
      # Every step above this one builds for the runner's own GOOS; releases go
      # out for five. So internal/mcp/builtin could use syscall.Setpgid and
      # syscall.Kill with no build tags from 4ded192 (2026-05-12) onward without
      # a single CI run noticing — the failure was reachable only by pushing a
      # tag, in the release workflow's windows matrix leg, which took the whole
      # release down with it: that matrix had no `fail-fast: false`, so its
      # siblings were cancelled mid-build (four in run 28437119947, three in
      # 28776556885 — linux/amd64 had already finished there), and the publish
      # job needs them all. v0.4.1 and v0.5.0 were tagged and got no GitHub
      # Release at all.
      #
      # `go vet` as well as `go build`, because `go build ./...` does not
      # compile _test.go files and a windows-hostile test would sail through it.
      #
      # Has to stay below "Build web": web/dist is not in git (tether#81), so
      # higher up this step would fail on `web/embed.go: pattern all:dist` for
      # every platform, including the ones that are fine. It does not care where
      # "Stamp SPA bundle" sits.
      - name: Cross-compile every released platform
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          source scripts/platforms.sh
          for p in "${PLATFORMS[@]}"; do
            echo "==> $p"
            GOOS="${p%/*}" GOARCH="${p#*/}" go build -o /dev/null ./...
            GOOS="${p%/*}" GOARCH="${p#*/}" go vet ./...
          done

      # ── wire-contract tests (D-22 §6) ───────────────────────────────────────
      - name: Run wire-contract tests
        run: cd web && pnpm test

      # ── Go tests ────────────────────────────────────────────────────────────
      # -race is the baseline, not an extra: internal/server runs a background
      # cert-rotation goroutine that shares state with request handlers and the
      # TLS handshake callback, and internal/session hands entries between
      # connections. -count=1 because the test cache will happily echo a stale
      # pass. Spelled out here rather than delegated to `make go-test` so a
      # local convenience edit to the Makefile can never weaken CI.
      - name: Run Go tests
        run: go test -count=1 -race ./...
